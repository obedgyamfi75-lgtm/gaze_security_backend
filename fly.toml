# =============================================================================
# Fly.io Configuration - Gaze Security Platform Backend
# =============================================================================

app = "gaze-security-backend"
primary_region = "iad"  # Change to closest region: lhr (London), fra (Frankfurt), sin (Singapore)

[build]
  dockerfile = "docker/app/Dockerfile.dev"

[env]
  FLASK_ENV = "development"
  FLASK_APP = "run.py"
  FLASK_DEBUG = "0"
  LOG_LEVEL = "INFO"
  EVIDENCE_PATH = "/app/evidence"
  ALLOWED_HOSTS = "gaze-security-backend.fly.dev"
  CORS_ORIGINS = "https://gaze-security-frontend.vercel.app/"  # Update after frontend deploys

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    port = 8000
    timeout = "5s"
    type = "http"