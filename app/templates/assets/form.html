{% extends "base.html" %}
{% block title %}{{ 'Edit' if asset else 'New' }} Asset{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-6">
        <a href="{{ url_for('assets.index') }}" class="text-gray-400 hover:text-white">← Back to Assets</a>
    </div>
    
    <div class="card p-6">
        <h1 class="text-2xl font-bold mb-6">
            {{ '✏️ Edit Asset' if asset else '➕ New Asset' }}
        </h1>
        
        <form method="POST" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <!-- Basic Info -->
            <div class="grid md:grid-cols-2 gap-6">
                <div class="md:col-span-2">
                    <label for="name" class="block text-sm font-medium text-gray-300 mb-2">
                        Asset Name <span class="text-red-400">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        required
                        maxlength="255"
                        value="{{ asset.name if asset else '' }}"
                        class="w-full px-4 py-2 rounded-lg"
                        placeholder="e.g., Customer Portal, Payment API"
                    >
                </div>
                
                <div>
                    <label for="asset_type" class="block text-sm font-medium text-gray-300 mb-2">
                        Asset Type <span class="text-red-400">*</span>
                    </label>
                    <select id="asset_type" name="asset_type" required class="w-full px-4 py-2 rounded-lg">
                        {% for t in asset_types %}
                        <option value="{{ t.value }}" {{ 'selected' if asset and asset.asset_type == t else '' }}>
                            {{ t.value.replace('_', ' ').title() }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div>
                    <label for="criticality" class="block text-sm font-medium text-gray-300 mb-2">
                        Criticality <span class="text-red-400">*</span>
                    </label>
                    <select id="criticality" name="criticality" required class="w-full px-4 py-2 rounded-lg">
                        {% for c in criticalities %}
                        <option value="{{ c.value }}" {{ 'selected' if asset and asset.criticality == c else '' }}>
                            {{ c.value.title() }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <!-- Technical Details -->
            <div class="border-t border-gray-700 pt-6">
                <h3 class="text-lg font-medium mb-4">Technical Details</h3>
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label for="url" class="block text-sm font-medium text-gray-300 mb-2">URL</label>
                        <input 
                            type="url" 
                            id="url" 
                            name="url"
                            maxlength="500"
                            value="{{ asset.url if asset else '' }}"
                            class="w-full px-4 py-2 rounded-lg"
                            placeholder="https://example.hubtel.com"
                        >
                    </div>
                    
                    <div>
                        <label for="environment" class="block text-sm font-medium text-gray-300 mb-2">Environment</label>
                        <select id="environment" name="environment" class="w-full px-4 py-2 rounded-lg">
                            <option value="">Select...</option>
                            <option value="production" {{ 'selected' if asset and asset.environment == 'production' else '' }}>Production</option>
                            <option value="staging" {{ 'selected' if asset and asset.environment == 'staging' else '' }}>Staging</option>
                            <option value="development" {{ 'selected' if asset and asset.environment == 'development' else '' }}>Development</option>
                            <option value="testing" {{ 'selected' if asset and asset.environment == 'testing' else '' }}>Testing</option>
                        </select>
                    </div>
                    
                    <div>
                        <label for="ip_address" class="block text-sm font-medium text-gray-300 mb-2">IP Address</label>
                        <input 
                            type="text" 
                            id="ip_address" 
                            name="ip_address"
                            maxlength="45"
                            value="{{ asset.ip_address if asset else '' }}"
                            class="w-full px-4 py-2 rounded-lg"
                            placeholder="192.168.1.1"
                            pattern="^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$"
                        >
                    </div>
                    
                    <div>
                        <label for="hostname" class="block text-sm font-medium text-gray-300 mb-2">Hostname</label>
                        <input 
                            type="text" 
                            id="hostname" 
                            name="hostname"
                            maxlength="255"
                            value="{{ asset.hostname if asset else '' }}"
                            class="w-full px-4 py-2 rounded-lg"
                            placeholder="server01.hubtel.internal"
                        >
                    </div>
                </div>
            </div>
            
            <!-- Ownership -->
            <div class="border-t border-gray-700 pt-6">
                <h3 class="text-lg font-medium mb-4">Ownership</h3>
                <div class="grid md:grid-cols-3 gap-6">
                    <div>
                        <label for="business_owner" class="block text-sm font-medium text-gray-300 mb-2">Business Owner</label>
                        <input 
                            type="text" 
                            id="business_owner" 
                            name="business_owner"
                            maxlength="255"
                            value="{{ asset.business_owner if asset else '' }}"
                            class="w-full px-4 py-2 rounded-lg"
                            placeholder="John Doe"
                        >
                    </div>
                    
                    <div>
                        <label for="technical_owner" class="block text-sm font-medium text-gray-300 mb-2">Technical Owner</label>
                        <input 
                            type="text" 
                            id="technical_owner" 
                            name="technical_owner"
                            maxlength="255"
                            value="{{ asset.technical_owner if asset else '' }}"
                            class="w-full px-4 py-2 rounded-lg"
                            placeholder="Jane Smith"
                        >
                    </div>
                    
                    <div>
                        <label for="team" class="block text-sm font-medium text-gray-300 mb-2">Team</label>
                        <input 
                            type="text" 
                            id="team" 
                            name="team"
                            maxlength="100"
                            value="{{ asset.team if asset else '' }}"
                            class="w-full px-4 py-2 rounded-lg"
                            placeholder="Platform Team"
                        >
                    </div>
                </div>
            </div>
            
            <!-- Description -->
            <div class="border-t border-gray-700 pt-6">
                <label for="description" class="block text-sm font-medium text-gray-300 mb-2">Description</label>
                <textarea 
                    id="description" 
                    name="description"
                    rows="4"
                    class="w-full px-4 py-2 rounded-lg"
                    placeholder="Brief description of this asset..."
                >{{ asset.description if asset else '' }}</textarea>
            </div>
            
            <!-- Actions -->
            <div class="flex justify-end gap-4 pt-6 border-t border-gray-700">
                <a href="{{ url_for('assets.index') }}" class="px-6 py-2 text-gray-400 hover:text-white">
                    Cancel
                </a>
                <button type="submit" class="btn-primary px-6 py-2 rounded-lg">
                    {{ 'Update Asset' if asset else 'Create Asset' }}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
