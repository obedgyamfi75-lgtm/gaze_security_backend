{% extends "base.html" %}
{% block title %}Admin{% endblock %}

{% block content %}
<div class="space-y-6">
    <h1 class="text-2xl font-bold">⚙️ Administration</h1>
    
    <div class="grid md:grid-cols-3 gap-6">
        <a href="{{ url_for('admin.users') }}" class="card p-6 hover:bg-gray-800 transition-colors">
            <div class="text-4xl mb-4">👥</div>
            <h2 class="text-lg font-semibold">User Management</h2>
            <p class="text-gray-400 text-sm mt-2">Create, edit, and manage user accounts and roles</p>
        </a>
        
        <a href="{{ url_for('admin.audit_logs') }}" class="card p-6 hover:bg-gray-800 transition-colors">
            <div class="text-4xl mb-4">📜</div>
            <h2 class="text-lg font-semibold">Audit Logs</h2>
            <p class="text-gray-400 text-sm mt-2">View security events and user activity</p>
        </a>
        
        <a href="{{ url_for('admin.settings') }}" class="card p-6 hover:bg-gray-800 transition-colors">
            <div class="text-4xl mb-4">🔧</div>
            <h2 class="text-lg font-semibold">Settings</h2>
            <p class="text-gray-400 text-sm mt-2">Configure system settings and policies</p>
        </a>
    </div>
</div>
{% endblock %}
