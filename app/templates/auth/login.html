{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block auth_content %}
<div class="card p-8 w-full max-w-md">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-green-400">🛡️ Security</h1>
        <p class="text-gray-400 mt-2">GAZE Security Platform</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-6" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div>
            <label for="email" class="block text-sm font-medium text-gray-300 mb-2">Email</label>
            <input type="email" id="email" name="email" required autocomplete="username"
                class="w-full px-4 py-3 rounded-lg focus:ring-2 focus:ring-green-400" placeholder="you@hubtel.com">
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-300 mb-2">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password"
                class="w-full px-4 py-3 rounded-lg focus:ring-2 focus:ring-green-400" placeholder="••••••••••••">
        </div>

        <button type="submit" class="w-full btn-primary py-3 rounded-lg font-semibold transition-colors">
            Sign In
        </button>
    </form>

    <p class="text-center text-gray-500 text-xs mt-8">
        Protected by MFA • Monitored for security
    </p>
</div>
{% endblock %}
