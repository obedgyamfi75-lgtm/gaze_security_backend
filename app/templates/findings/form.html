{% extends "base.html" %}
{% block title %}{{ 'Edit' if finding else 'New' }} Finding{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="mb-6">
        <a href="{{ url_for('findings.index') }}" class="text-gray-400 hover:text-white">← Back to Findings</a>
    </div>
    
    <div class="card p-6">
        <h1 class="text-2xl font-bold mb-6">
            {{ '✏️ Edit Finding' if finding else '➕ New Finding' }}
        </h1>
        
        <form method="POST" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <!-- Basic Info -->
            <div>
                <label for="title" class="block text-sm font-medium text-gray-300 mb-2">
                    Title <span class="text-red-400">*</span>
                </label>
                <input 
                    type="text" 
                    id="title" 
                    name="title" 
                    required
                    maxlength="500"
                    value="{{ finding.title if finding else '' }}"
                    class="w-full px-4 py-2 rounded-lg"
                    placeholder="e.g., SQL Injection in Login Form"
                >
            </div>
            
            <div class="grid md:grid-cols-3 gap-6">
                <div>
                    <label for="assessment_id" class="block text-sm font-medium text-gray-300 mb-2">
                        Assessment <span class="text-red-400">*</span>
                    </label>
                    <select id="assessment_id" name="assessment_id" required class="w-full px-4 py-2 rounded-lg">
                        <option value="">Select assessment...</option>
                        {% for a in assessments %}
                        <option value="{{ a.id }}" {{ 'selected' if finding and finding.assessment_id == a.id else '' }}>
                            {{ a.name }} ({{ a.asset.name if a.asset else 'No asset' }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div>
                    <label for="severity" class="block text-sm font-medium text-gray-300 mb-2">
                        Severity <span class="text-red-400">*</span>
                    </label>
                    <select id="severity" name="severity" required class="w-full px-4 py-2 rounded-lg">
                        {% for s in severities %}
                        <option value="{{ s.value }}" {{ 'selected' if finding and finding.severity == s else '' }}>
                            {{ s.value.title() }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div>
                    <label for="cvss_score" class="block text-sm font-medium text-gray-300 mb-2">CVSS Score</label>
                    <input 
                        type="number" 
                        id="cvss_score" 
                        name="cvss_score"
                        step="0.1"
                        min="0"
                        max="10"
                        value="{{ finding.cvss_score if finding and finding.cvss_score else '' }}"
                        class="w-full px-4 py-2 rounded-lg"
                        placeholder="0.0 - 10.0"
                    >
                </div>
            </div>
            
            <!-- Classification -->
            <div class="border-t border-gray-700 pt-6">
                <h3 class="text-lg font-medium mb-4">Classification</h3>
                <div class="grid md:grid-cols-4 gap-4">
                    <div>
                        <label for="cwe_id" class="block text-sm font-medium text-gray-300 mb-2">CWE ID</label>
                        <input 
                            type="text" 
                            id="cwe_id" 
                            name="cwe_id"
                            maxlength="20"
                            value="{{ finding.cwe_id if finding else '' }}"
                            class="w-full px-4 py-2 rounded-lg"
                            placeholder="CWE-79"
                        >
                    </div>
                    <div>
                        <label for="cve_id" class="block text-sm font-medium text-gray-300 mb-2">CVE ID</label>
                        <input 
                            type="text" 
                            id="cve_id" 
                            name="cve_id"
                            maxlength="20"
                            value="{{ finding.cve_id if finding else '' }}"
                            class="w-full px-4 py-2 rounded-lg"
                            placeholder="CVE-2024-1234"
                        >
                    </div>
                    <div>
                        <label for="owasp_category" class="block text-sm font-medium text-gray-300 mb-2">OWASP Category</label>
                        <input 
                            type="text" 
                            id="owasp_category" 
                            name="owasp_category"
                            maxlength="100"
                            value="{{ finding.owasp_category if finding else '' }}"
                            class="w-full px-4 py-2 rounded-lg"
                            placeholder="A01:2021"
                        >
                    </div>
                    <div>
                        <label for="cvss_vector" class="block text-sm font-medium text-gray-300 mb-2">CVSS Vector</label>
                        <input 
                            type="text" 
                            id="cvss_vector" 
                            name="cvss_vector"
                            maxlength="100"
                            value="{{ finding.cvss_vector if finding else '' }}"
                            class="w-full px-4 py-2 rounded-lg"
                            placeholder="CVSS:3.1/AV:N/AC:L/..."
                        >
                    </div>
                </div>
            </div>
            
            <!-- Affected Components -->
            <div class="border-t border-gray-700 pt-6">
                <h3 class="text-lg font-medium mb-4">Affected Components</h3>
                <div class="grid md:grid-cols-3 gap-4">
                    <div>
                        <label for="affected_component" class="block text-sm font-medium text-gray-300 mb-2">Component</label>
                        <input 
                            type="text" 
                            id="affected_component" 
                            name="affected_component"
                            maxlength="500"
                            value="{{ finding.affected_component if finding else '' }}"
                            class="w-full px-4 py-2 rounded-lg"
                            placeholder="Authentication Module"
                        >
                    </div>
                    <div>
                        <label for="affected_url" class="block text-sm font-medium text-gray-300 mb-2">URL</label>
                        <input 
                            type="text" 
                            id="affected_url" 
                            name="affected_url"
                            value="{{ finding.affected_url if finding else '' }}"
                            class="w-full px-4 py-2 rounded-lg"
                            placeholder="/api/v1/login"
                        >
                    </div>
                    <div>
                        <label for="affected_parameter" class="block text-sm font-medium text-gray-300 mb-2">Parameter</label>
                        <input 
                            type="text" 
                            id="affected_parameter" 
                            name="affected_parameter"
                            maxlength="255"
                            value="{{ finding.affected_parameter if finding else '' }}"
                            class="w-full px-4 py-2 rounded-lg"
                            placeholder="username"
                        >
                    </div>
                </div>
            </div>
            
            <!-- Description -->
            <div class="border-t border-gray-700 pt-6">
                <label for="description" class="block text-sm font-medium text-gray-300 mb-2">
                    Description <span class="text-red-400">*</span>
                </label>
                <textarea 
                    id="description" 
                    name="description"
                    required
                    rows="4"
                    class="w-full px-4 py-2 rounded-lg"
                    placeholder="Detailed description of the vulnerability..."
                >{{ finding.description if finding else '' }}</textarea>
            </div>
            
            <!-- Impact -->
            <div>
                <label for="impact" class="block text-sm font-medium text-gray-300 mb-2">Impact</label>
                <textarea 
                    id="impact" 
                    name="impact"
                    rows="3"
                    class="w-full px-4 py-2 rounded-lg"
                    placeholder="Business and technical impact..."
                >{{ finding.impact if finding else '' }}</textarea>
            </div>
            
            <!-- Steps to Reproduce -->
            <div>
                <label for="steps_to_reproduce" class="block text-sm font-medium text-gray-300 mb-2">Steps to Reproduce</label>
                <textarea 
                    id="steps_to_reproduce" 
                    name="steps_to_reproduce"
                    rows="5"
                    class="w-full px-4 py-2 rounded-lg font-mono text-sm"
                    placeholder="1. Navigate to /login&#10;2. Enter payload in username field&#10;3. ..."
                >{{ finding.steps_to_reproduce if finding else '' }}</textarea>
            </div>
            
            <!-- POC Code -->
            <div>
                <label for="poc_code" class="block text-sm font-medium text-gray-300 mb-2">Proof of Concept Code</label>
                <textarea 
                    id="poc_code" 
                    name="poc_code"
                    rows="6"
                    class="w-full px-4 py-2 rounded-lg font-mono text-sm bg-gray-900"
                    placeholder="curl -X POST https://target.com/api/login -d 'username=admin&apos; OR 1=1--'"
                >{{ finding.poc_code if finding else '' }}</textarea>
            </div>
            
            <!-- Recommendation -->
            <div>
                <label for="recommendation" class="block text-sm font-medium text-gray-300 mb-2">Recommendation</label>
                <textarea 
                    id="recommendation" 
                    name="recommendation"
                    rows="4"
                    class="w-full px-4 py-2 rounded-lg"
                    placeholder="Recommended remediation steps..."
                >{{ finding.recommendation if finding else '' }}</textarea>
            </div>
            
            <!-- Actions -->
            <div class="flex justify-end gap-4 pt-6 border-t border-gray-700">
                <a href="{{ url_for('findings.index') }}" class="px-6 py-2 text-gray-400 hover:text-white">
                    Cancel
                </a>
                <button type="submit" class="btn-primary px-6 py-2 rounded-lg">
                    {{ 'Update Finding' if finding else 'Create Finding' }}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
